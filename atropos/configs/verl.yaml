data:
  truncation: error
  trust_remote_code: false
  max_prompt_length: 1024
  max_response_length: 2048

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  gamma: 1.0
  lam: 1.0
  rollout_correction:
    # Geometric RS for rejection, no explicit IS (PPO ratio handles it)
    rollout_rs: "geometric"
    rollout_rs_threshold: 3.0
    rollout_rs_threshold_lower: 0.3
    rollout_is: null  # Disabled - PPO ratio handles IS correction
    rollout_is_threshold: 5.0
    # Veto sequences with ANY token having IS weight < threshold
    # This catches catastrophic per-token staleness that geometric mean misses
    rollout_token_veto_threshold: 0.0000000001  # 1e-10, log threshold = -23

trainer:
  nnodes: 1
  n_gpus_per_node: null
  val_before_train: false
  resume_mode: disable

model:
  lora_rank: 0
  lora_alpha: 32
  enable_gradient_checkpointing: true
  override_config:
    attn_implementation: flash_attention_2

actor:
  strategy: fsdp
  lr: 1e-5
  ppo_micro_batch_size_per_gpu: 32
  ppo_epochs: 1
  loss_agg_mode: token-mean
  entropy_coeff: 0.01
  grad_clip: 1.0
  clip_ratio: 0.2
  use_kl_loss: true
  kl_loss_coef: 0.0
  fsdp_config:
    param_offload: false
    optimizer_offload: false
    model_dtype: bfloat16

rollout:
  engine: sglang
  mode: async
  prompt_length: 1024
  response_length: 2048
  temperature: 0.7
  tensor_model_parallel_size: 1
  gpu_memory_utilization: 0.15
  log_prob_micro_batch_size_per_gpu: 8
  load_format: safetensors
  dtype: bfloat16
  enforce_eager: false
  free_cache_engine: false
  engine_kwargs:
    sglang:
      attention_backend: flashinfer

ref:
  log_prob_micro_batch_size_per_gpu: 8
  fsdp_config:
    param_offload: false
    optimizer_offload: false
    model_dtype: bfloat16

checkpoint:
  dir: "./checkpoints/"
  save_interval: 50

ray_kwargs:
  ray_init:
    address: null
    namespace: verl
